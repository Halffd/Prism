[package]
name = "prism-egui"
version = "0.1.0"
edition = "2021"
description = "Prism desktop chat client built with egui"

[dependencies]
eframe = "0.36"
egui = "0.36"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "6"
anyhow = "1"
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
