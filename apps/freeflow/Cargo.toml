[package]
name = "freeflow"
version = "0.1.0"
edition = "2021"
description = "FreeFlow — a free, unlocked AI creative suite (Dioxus/WASM)"

# Its own workspace root, so building FreeFlow never drags Prism's member
# set (and its lock file) into the build, and vice versa.
[workspace]

[lib]
# rlib only: the browser artifact is the *binary*. A cdylib here would be a
# second wasm with the same base name, which trunk cannot choose between.
crate-type = ["rlib"]

[dependencies]
dioxus = { version = "0.7.10", features = ["web"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The one timer the app needs: keep the skeleton visible long enough to read
# as work rather than a flash. `setTimeout` from Rust, no hand-rolled JS.
gloo-timers = "0.3"

# ---- how to run ----
# On this host the default PATH resolves `cargo` to a distro build with no
# wasm32 target, and `execvp` cannot expand the literal `~/.local/bin` that
# carries trunk. So:
#   export PATH="$HOME/.cargo/bin:$PATH"
#   $HOME/.local/bin/trunk serve apps/freeflow/index.html
#
# The `<div id="main">` in index.html is load-bearing: without it
# dioxus-web falls back to mounting into a *detached* body element and the
# page stays blank.