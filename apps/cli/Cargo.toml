[package]
name = "prism-cli"
version = "0.1.0"
edition = "2021"
description = "Prism native terminal harness (ratatui) over prism-core"

[[bin]]
name = "prism"
path = "src/main.rs"

[lints.rust]
# Cross-crate cfg: prism-core gates its native transport on this feature.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("native-transport"))'] }

[dependencies]
prism-core = { path = "../../crates/prism-core", features = ["native-transport"] }
anyhow.workspace = true
serde_json.workspace = true
ratatui = "0.30"
crossterm = "0.28"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tempfile.workspace = true
