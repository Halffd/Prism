[package]
name = "prism-core"
version = "0.1.0"
edition = "2021"
description = "Single AI core for all Prism surfaces: provider clients, streaming decoders, thinking, settings, conversations"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
async-trait = { workspace = true }
futures-util = { workspace = true }
regex = { workspace = true }

# Native transport (reqwest + tokio) and native host glue (dirs). WASM
# builds use their own transport impl (fetch) and disable this feature;
# the core logic itself is transport-free and replays byte fixtures
# identically on both targets.
tokio = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
dirs = { version = "6", optional = true }

# Real neural inference (features `candle-sd` / `candle-llm`). Kept optional
# so WASM and preview-only builds stay small; hosts opt in when local weights
# and CPU/GPU compute are available.
candle-core = { version = "0.11.1", optional = true }
candle-transformers = { version = "0.11.1", optional = true }
tokenizers = { version = "0.21.2", optional = true }

[dev-dependencies]
tempfile = { workspace = true }
proptest = { workspace = true }

# Landlock/seccomp enforcement primitives (prism sandbox, Linux only).
[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[features]
default = ["native-transport"]
native-transport = ["dep:tokio", "dep:reqwest", "dep:dirs"]
candle-sd = ["dep:candle-core", "dep:candle-transformers", "dep:tokenizers"]
# Real quantized chat inference from a local GGUF + tokenizer.json.
candle-llm = ["dep:candle-core", "dep:candle-transformers", "dep:tokenizers"]
