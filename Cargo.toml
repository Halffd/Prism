[workspace]
resolver = "2"
default-members = ["crates/prism-core", "crates/prism-wasm", "apps/slint", "apps/cli", "apps/native-server"]
members = [
    "crates/prism-core",
    "crates/prism-wasm",
    "apps/slint",
    "apps/cli",
    "apps/native-server",
    # The canvas node-graph studio (Dioxus/WASM). Web-only: it is built by
    # trunk from apps/graph, never part of a desktop/native binary.
    "apps/graph",
]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
async-trait = "0.1"
tempfile = "3"
proptest = "1"
