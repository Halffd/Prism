[workspace]
resolver = "2"
members = ["crates/prism-core", "crates/prism-wasm", "apps/egui", "apps/slint"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
reqwest = { version = "0.13", features = ["json", "stream"] }
futures-util = "0.3"
async-trait = "0.1"
tempfile = "3"
proptest = "1"
